site_name: Librairie des Standards
site_description: Portail officiel des procédures
site_url: https://shibukawa310.github.io/Test-Library/

theme:
  name: material
  language: fr
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - navigation.tabs        # Recommandé pour le versionnement
    - navigation.instant     # Chargement plus rapide
    - search.suggest
    - search.highlight
    - navigation.tracking    # Met à jour l'URL quand on défile
    - navigation.expand      # Optionnel : ouvre les menus par défaut

extra:
  version:
    method: mike             # <--- Indispensable pour que le menu Mike apparaisse

plugins:
  - search
  - tags                     # <--- Système de tags pour le moteur de recherche

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - abbr                     # <--- Correction effectuée ici
  - pymdownx.snippets:
      base_path: ["includes"]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
